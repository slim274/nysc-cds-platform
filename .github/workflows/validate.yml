name: Validate NYSC CDS Platform

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
      API_RATE_LIMIT_PEPPER: ci-test-only-rate-limit-pepper-with-more-than-32-bytes
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Compile database seed
        run: bun build packages/database/src/seed/index.ts --outdir /tmp/nysc-cds-seed-check --target=bun

      - name: Typecheck API
        run: bun run --filter @nysc/api typecheck

      - name: Run API unit tests
        run: bun run --filter @nysc/api test

      - name: Check Svelte components
        run: bun run --filter @nysc/web check

      - name: Build frontend
        run: bun run --filter @nysc/web build

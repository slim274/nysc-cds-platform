name: Validate NYSC CDS Platform

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck API
        run: bun run --filter @nysc/api typecheck

      - name: Check Svelte components
        run: bun run --filter @nysc/web check

      - name: Build frontend
        run: bun run --filter @nysc/web build
